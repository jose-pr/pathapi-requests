[build-system]
# PEP 639 `license`/`license-files` below need hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "uripath-http-requests"
version = "0.10.0"
authors = [{ name = "Jose A" }]
description = "The requests HTTP transport for uripath: your own requests.Session, ~/.netrc, REQUESTS_CA_BUNDLE and SOCKS proxies"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639: SPDX license expression plus the file it refers to. This replaces
# the legacy `License ::` classifier; do not list one alongside it.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    # src/uripath_http_requests/py.typed ships in the wheel.
    "Typing :: Typed",
]
dependencies = [
    "uripath>=0.10.0,<0.11",
    # Before 2.18 the bundled urllib3 imports the ABCs from `collections` (a
    # DeprecationWarning on 3.9); 2.21 caps urllib3 below 1.25, which botocore
    # 1.36 cannot share.
    "requests>=2.22.0,<3",
]

[project.optional-dependencies]
# SOCKS proxies (`socks5://...`) need PySocks, which `requests` installs with this extra.
socks = ["requests[socks]>=2.22.0,<3"]
dev = [
    'uripath-http-requests[socks]',
    'build',
    'twine',
    'hatchling',
    'pytest',
    'pytest-cov',
    'wsgidav',
    'cheroot',
    'cryptography',
    'black',
]
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

# The HTTP transports `uripath` can send through. The value is a class that is
# built with no arguments; `uripath.transports.names()` lists it without
# importing this package.
[project.entry-points."uripath.http_transports"]
requests = "uripath_http_requests:RequestsTransport"

[project.urls]
Homepage = "https://github.com/jose-pr/uripath-http-requests/"
Documentation = "https://jose-pr.github.io/uripath-http-requests/"
Issues = "https://github.com/jose-pr/uripath-http-requests/issues"

# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/uripath_http_requests/AGENTS.md (the API header) is included automatically
# by living in the package dir. The repo-root AGENTS.md is contributor
# orientation for a checkout and is not part of the wheel.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "uripath_http_requests/README.md"

# `*.local.*` files are per-machine overrides and `CLAUDE*` is agent config:
# neither is ever packaged (both are also gitignored). `/.*` does not match
# them, since their names do not start with a dot.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/uripath_http_requests"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
# Pinned to the project's *minimum* supported Python so black never emits
# syntax the 3.9 floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
